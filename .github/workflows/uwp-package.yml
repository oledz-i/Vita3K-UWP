name: UWP development package
on:
  push:
    branches: [main, core-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uwp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream-memory-regression:
    name: Execute pinned Vita3K allocator regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile and execute authentic Vita3K allocator
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic \
            -Ithird_party/vita3k/mem/include \
            tests/upstream_allocator_smoke.cpp \
            third_party/vita3k/mem/src/allocator.cpp \
            -o upstream_allocator_smoke
          ./upstream_allocator_smoke
      - name: Validate Vita metadata parser and menu soundtrack generation
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic \
            tests/catalog_native_smoke.cpp \
            src/Vita3K.UWP/SfoReader.cpp \
            src/Vita3K.UWP/GameFormats.cpp \
            src/Vita3K.UWP/MenuMusic.cpp \
            -o catalog_native_smoke
          ./catalog_native_smoke
  full-core-uwp-probe:
    name: Attempt genuine Vita3K libretro source UWP port
    if: github.ref == 'refs/heads/core-integration' || github.head_ref == 'core-integration'
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch pinned complete Vita3K core source with submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content core-candidates.lock.json -Raw | ConvertFrom-Json
          git clone --branch $lock.libretro_candidate.branch --depth 25 $lock.libretro_candidate.repository upstream-core
          if ($LASTEXITCODE -ne 0) { throw 'Could not clone complete libretro core source' }
          git -C upstream-core checkout --detach $lock.libretro_candidate.commit
          if ($LASTEXITCODE -ne 0) { throw 'Pinned core checkout failed' }
          git -C upstream-core submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw 'Core dependencies checkout failed' }
          $actual = (git -C upstream-core rev-parse HEAD).Trim()
          if ($actual -ne $lock.libretro_candidate.commit) { throw 'Wrong upstream core revision' }
          Set-Content pinned-core-commit.txt $actual
      - name: Configure and attempt Windows Store DLL compilation
        shell: pwsh
        run: ./scripts/probe-vita3k-uwp.ps1
      - name: Save compiler diagnostics and any real core DLL
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vita3k-full-core-uwp-port-probe
          path: |
            artifacts/core-port/
            pinned-core-commit.txt
          if-no-files-found: warn
          retention-days: 14
  dozen-uwp-port-probe:
    name: Attempt genuine Mesa Dozen Vulkan D3D12 UWP driver
    if: github.ref == 'refs/heads/core-integration' || github.head_ref == 'core-integration'
    runs-on: windows-2022
    timeout-minutes: 55
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Attempt Mesa Dozen Windows Store/AppContainer build
        shell: pwsh
        run: ./scripts/probe-dozen-uwp.ps1
      - name: Upload Mesa Vulkan-on-D3D12 source build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mesa-dozen-xbox-uwp-port-probe
          path: artifacts/dozen-port/
          if-no-files-found: warn
          retention-days: 14
  package:
    name: Build x64 development APPX
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository
        run: python scripts/validate.py
      - name: Build and sign development package
        shell: pwsh
        run: ./scripts/build-appx.ps1 -BuildNumber ${{ github.run_number }}
      - name: Upload development package and public certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vita3K-UWP-core-d3d12-x64-${{ github.run_number }}
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uwp-build-logs-${{ github.run_number }}
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
