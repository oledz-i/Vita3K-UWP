name: UWP development package
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uwp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Build x64 development APPX
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository
        run: python scripts/validate.py
      - name: Build and sign development package
        shell: pwsh
        run: ./scripts/build-appx.ps1 -BuildNumber ${{ github.run_number }}
      - name: Upload development package and public certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Vita3K-UWP-dev-shell-x64-${{ github.run_number }}
          path: artifacts/package/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uwp-build-logs-${{ github.run_number }}
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7
