name: Onyx UWP Dynarmic JIT patches for Vita3K
on:
  push:
    branches: [vita-onyx-dynarmic]
  pull_request:
    branches: [uwp-filesystem-port]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch-genuine-vita-jit:
    name: Apply all Onyx W^X patches to actual Vita3K Dynarmic source
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate UWP filesystem source patch before expensive core builds
        shell: pwsh
        run: |
          python tests/test_patch_vita3k_uwp.py
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem port regression failed' }
          python tests/test_patch_vita3k_uwp_deps.py
          if ($LASTEXITCODE -ne 0) { throw 'Audio/CppCommon WindowsStore patch regression failed' }
      - name: Fetch pinned actual Vita3K ARM JIT sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Type Directory 'dynarmic-src' -Force | Out-Null
          git -C dynarmic-src init
          git -C dynarmic-src remote add origin https://github.com/Vita3K/dynarmic.git
          git -C dynarmic-src fetch --depth 1 origin 86458a0bd369d63ba4c2ef812cacbb6c9080c065
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch pinned Vita3K Dynarmic fork' }
          git -C dynarmic-src checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Vita3K Dynarmic checkout failed' }
          $actual = (git -C dynarmic-src rev-parse HEAD).Trim()
          if ($actual -ne '86458a0bd369d63ba4c2ef812cacbb6c9080c065') { throw 'Vita3K Dynarmic pin changed' }
      - name: Apply actual Onyx Dynarmic UWP JIT patch series
        shell: pwsh
        run: ./scripts/apply-onyx-dynarmic.ps1 -DynarmicSource ./dynarmic-src
      - name: Keep precise cross-fork patch compatibility results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: onyx-dynarmic-vita-arm-jit-port
          path: artifacts/onyx-dynarmic/
          if-no-files-found: warn
          retention-days: 14
  arm32-jit-uwp-static:
    name: Compile actual Vita ARMv7 Dynarmic JIT as WindowsStore x64 library
    needs: [patch-genuine-vita-jit]
    runs-on: windows-2022
    timeout-minutes: 65
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Fetch original Vita3K dependencies and Dynarmic ARMv7 sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content core-candidates.lock.json -Raw | ConvertFrom-Json
          git clone --depth 25 --branch $lock.libretro_candidate.branch $lock.libretro_candidate.repository upstream-core
          if ($LASTEXITCODE) { throw 'Vita3K libretro checkout failed' }
          git -C upstream-core checkout --detach $lock.libretro_candidate.commit
          if ($LASTEXITCODE) { throw 'Pinned Vita3K source checkout failed' }
          git -C upstream-core submodule update --init --recursive --depth 1
          if ($LASTEXITCODE) { throw 'Dynarmic dependency checkout failed' }
      - name: Build genuine Vita3K guest ARM CPU for Xbox UWP
        shell: pwsh
        run: ./scripts/build-vita-dynarmic-uwp.ps1
      - name: Upload Vita ARM CPU compile diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vita3k-dynarmic-arm32-x64-uwp
          path: |
            artifacts/dynarmic-uwp/
            artifacts/onyx-dynarmic/
          if-no-files-found: warn
          retention-days: 14
  full-vita3k-core-uwp:
    name: Compile genuine Vita3K libretro CPU/kernel with Onyx JIT fixes
    needs: [patch-genuine-vita-jit]
    runs-on: windows-2022
    timeout-minutes: 95
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Restore UWP vcpkg binary cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: vcpkg-bincache
          key: vita3k-uwp-vcpkg-v2-${{ hashFiles('core-candidates.lock.json', 'scripts/patch-vita3k-uwp.py') }}
          restore-keys: |
            vita3k-uwp-vcpkg-v2-
      - name: Configure reproducible UWP binary cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'vcpkg-bincache'
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          Add-Content $env:GITHUB_ENV "VCPKG_BINARY_SOURCES=clear;files,$cache,readwrite"
      - name: Checkout complete pinned Vita3K libretro core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = Get-Content core-candidates.lock.json -Raw | ConvertFrom-Json
          git clone --branch $lock.libretro_candidate.branch --depth 25 $lock.libretro_candidate.repository upstream-core
          if ($LASTEXITCODE) { throw 'Vita3K libretro core clone failed' }
          git -C upstream-core checkout --detach $lock.libretro_candidate.commit
          if ($LASTEXITCODE) { throw 'Pinned Vita3K libretro core checkout failed' }
          git -C upstream-core submodule update --init --recursive --depth 1
          if ($LASTEXITCODE) { throw 'Vita3K dependencies checkout failed' }
          if ((git -C upstream-core rev-parse HEAD).Trim() -ne $lock.libretro_candidate.commit) {
            throw 'Unpinned Vita3K core source'
          }
      - name: Install NASM for upstream OpenSSL and x64 Vita3K core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          $nasmDir = 'C:\Program Files\NASM'
          if (!(Test-Path (Join-Path $nasmDir 'nasm.exe'))) { throw 'NASM binary was not installed' }
          $env:PATH = "$nasmDir;$env:PATH"
          if (!(Get-Command nasm -ErrorAction SilentlyContinue)) { throw 'NASM missing from PATH' }
          nasm -v
          Add-Content -Path $env:GITHUB_PATH -Value $nasmDir
      - name: Try real Vita3K WindowsStore libretro build with Onyx W^X and std::filesystem
        shell: pwsh
        run: ./scripts/probe-vita3k-uwp.ps1
      - name: Upload complete emulator core compile results and JIT patch logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vita3k-core-with-onyx-xbox-jit
          path: |
            artifacts/core-port/
            artifacts/onyx-dynarmic/
          if-no-files-found: warn
          retention-days: 14
